name: Trigger Target Workflow

on:
  workflow_dispatch:
    inputs:
        branch_name:
          description: 'Branch name to create'
          required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.BRIDGE_APP_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: sensein 
          repositories: b2aiprep

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      
      - name: Set up Git configuration
        run: |
          git rev-parse --abbrev-ref HEAD
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global credential.helper cache
          echo "BRANCH_NAME=${{github.event.inputs.branch_name }}" >> $GITHUB_ENV
          

      - name: Create the new branch
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          echo "Creating new branch: $BRANCH_NAME"
          git checkout -b $BRANCH_NAME

      - name: Get redcap2rs files
        run: |
          git clone --depth 1 https://${{ steps.app-token.outputs.token }}@github.com/sensein/b2ai-redcap2rs
          mkdir -p src/b2aiprep/redcap2rs
          cp -r b2ai-redcap2rs/* src/b2aiprep/redcap2rs
          git -C b2ai-redcap2rs rev-parse HEAD > src/b2aiprep/redcap2rs/commit_sha.txt

      - name: Flag stimulus-asset & docs drift vs new bridge2ai-redcap
        continue-on-error: true
        env:
          # reads the public eipm/bridge2ai-redcap repo (the images/docs source, which is
          # separate from b2ai-redcap2rs above); the default token suffices for public reads
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if python scripts/flag_stimulus_asset_changes.py \
               --registry src/b2aiprep/prepare/resources/task_registry/registry.json \
               --report drift_report.md; then
            echo "no drift"
          else
            echo "::warning title=stimulus/docs drift::bridge2ai-redcap docs or stimulus assets changed (or the check errored) -- see the PR body / job summary"
          fi
          { echo "## RedCap docs / stimulus-asset drift"; echo; cat drift_report.md 2>/dev/null || echo "(no report produced)"; } \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit redcap2rs files
        run: |
          git add src/b2aiprep/redcap2rs
          git commit -m "$(date): update redcap2rs files"
          git push --set-upstream https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }} $BRANCH_NAME
          
      - name: Create Pull Request
        run: |
          BODY="Automatically added RedCap2RS files to b2aiprep."
          if [ -f drift_report.md ]; then
            # cap the embedded report so the PR body stays under GitHub's 65536-char limit;
            # the full report is always in the job summary
            REPORT="$(head -c 50000 drift_report.md)"
            if [ "$(wc -c < drift_report.md)" -gt 50000 ]; then
              REPORT="$REPORT"$'\n\n...(truncated; see the job summary for the full report)'
            fi
            BODY="$BODY"$'\n\n---\n\n'"$REPORT"
          fi
          jq -n \
            --arg title "Update files for $BRANCH_NAME" \
            --arg head "$BRANCH_NAME" \
            --arg base "main" \
            --arg body "$BODY" \
            '{title: $title, head: $head, base: $base, body: $body}' > pr_payload.json
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/sensein/b2aiprep/pulls \
            -d @pr_payload.json
      