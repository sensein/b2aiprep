name: CI

on:
  pull_request:
    # release/** too: release work (e.g. release/v4.1.0) is merged through PRs into those branches.
    branches: [main, "release/**"]
  workflow_dispatch:  # Add workflow dispatch trigger
  
jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3
        with:  # no need for the history
          fetch-depth: 1
          submodules: recursive
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --no-cache-dir --editable=".[dev]"

      - name: Test with pytest
        run: |
          pytest tests

  vendored-task-registry:
    # registry.json and task_instructions_es_419.json are generated from bridge2ai-redcap and
    # committed. This job regenerates both from the tag registry.json names and fails when the
    # committed files differ, so an edit made to them by hand is caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Read the bridge2ai-redcap tag the registry is built from
        id: redcap
        run: |
          echo "tag=$(python -c "import json; print(json.load(open('src/b2aiprep/prepare/resources/task_registry/registry.json'))['source']['git_tag'])")" >> "$GITHUB_OUTPUT"

      - name: Check out bridge2ai-redcap at that tag
        uses: actions/checkout@v3
        with:
          repository: eipm/bridge2ai-redcap
          ref: ${{ steps.redcap.outputs.tag }}
          path: bridge2ai-redcap
          fetch-depth: 1

      - name: Regenerated files match the committed ones
        run: |
          python scripts/build_task_registry.py --redcap-root bridge2ai-redcap --git-tag "${{ steps.redcap.outputs.tag }}" --check
          python scripts/harvest_es419_banks.py --redcap-root bridge2ai-redcap --check

