[build-system]
requires = ["setuptools>=62.3.0", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "b2aiprep"
dynamic = ["version"]
authors = [
  {name = "Rahul Brito", email = "rfbrito@mit.edu"},
  {name = "SenseIn Group", email = "sensein-social@mit.edu" },
]
description = """A small package to generate features from acoustic
recordings for the Bridge2AI voice project."""
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10, <3.14"
dependencies = [
    # senselab 1.4 band-limits resample_audios (senselab#632), so the 16 kHz FLACs and every feature change.
    # ppgs and SPARC run in senselab's own venvs in 1.4, installed from senselab's locks (the ppgs venv: Python 3.11,
    # espnet 202301), so b2aiprep needs no espnet constraint.
    "senselab>=1.4.0a14",
    "matplotlib>=3.8.3",
    "fhir.resources==7.1.0",
    "streamlit>=1.42.2",
    "av~=14.1.0",
    "soundfile==0.13.1",  # pinned: libsndfile ships in the wheel and fixes the released FLAC bytes
    "pydra",
    # Exact, as in senselab 1.4's lock: torchaudio's and torchvision's compiled extensions load only against the
    # torch they were built for (torch 2.11.0 with torchaudio 2.11.1 fails with an undefined symbol).
    "torchaudio==2.11.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tzdata"  # IANA time-zone database for zoneinfo (date shifting), on systems without one
]

[tool.setuptools.packages.find]
where = ["src"] # <-- this changed

[tool.setuptools.package-data]
"*" = ["*.*", ".gitkeep"]
b2aiprep = ["redcap2rs/**/*", "prepare/resources/task_registry/**/*"]

[project.optional-dependencies]
doc = [
    "jupyterlab",
    "jupytext",
    "ipympl"
]
qc = [
    # run-quality-control-on-audios --deep_checks only: senselab's review_files needs snorkel,
    # which senselab 1.4 no longer installs
    "snorkel>=0.10,<0.11"
]
dev = [
    "b2aiprep[doc,qc]",
    "pytest",
    "pytest-benchmark",
    "pre-commit",
    "ruff",
    "responses",
    "senselab"
]
dashboard = [
    "b2aiprep[doc]",
    "streamlit>=1.42.2",
    "senselab"
]
scripts = [
    # scripts/build_postal_code_timezones.py only: refreshes the committed postal-code tables
    # (GeoNames and zip2info data are downloaded by the script, not installed)
    "timezonefinder"
]

[project.scripts]
b2aiprep-cli = "b2aiprep.cli:cli"
b2aiprep-dashboard = "b2aiprep.dashboard.entrypoint:main"

[project.urls]
Homepage = "https://github.com/sensein/b2aiprep"
Issues = "https://github.com/sensein/b2aiprep/issues"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/b2aiprep/_version.py"
versionfile_build = "b2aiprep/_version.py"
tag_prefix = ""
parentdir_prefix = "myproject-"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
